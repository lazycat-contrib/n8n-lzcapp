version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: n8n
build:
  toolchains: []
  run_buildscript: false
images:
  - id: n8n
    target: service
    service: n8n
    source: n8nio/n8n
    channel: stable
    sort: semver
    # tags include v3-rc-*, next, beta and -pc variants -- keep to plain x.y.z
    tag_regex: ^[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: n8n
    skip_if_version_exists: true
