version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: n8n
build:
  toolchains: []
  run_buildscript: false
images:
  - id: n8n
    target: service
    service: n8n
    source: n8nio/n8n
    channel: stable
    sort: semver
    # Tags include v3-rc-*, next, beta and -pc variants. Plain x.y.z is not
    # enough either: every 3.x image carries N8N_RELEASE_TYPE=rc (checked on
    # 3.0.0 / 3.0.1), while 2.46.x is N8N_RELEASE_TYPE=stable and is what the
    # "latest" tag points at. Semver ordering alone would pick the RC line, so
    # pin the major version to the stable series.
    tag_regex: ^2[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: n8n
    skip_if_version_exists: true
